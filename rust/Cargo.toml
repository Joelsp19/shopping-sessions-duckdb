[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sessions"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
memchr = "2"
parquet = { version = "55", default-features = false }
bytes = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
